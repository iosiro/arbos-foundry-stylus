name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check -p stylus --features cc_brotli
      - run: cargo test -p arbutil -p validation --features brotli/cc_brotli
      - run: cargo test -p stylus --lib --features cc_brotli test::native::test_ink
      - run: cargo test -p stylus --lib --features cc_brotli test::native::test_import_export_safety
      - run: cargo test -p stylus --lib --features cc_brotli test::misc::test_bulk_memory
      - run: cargo test -p stylus --lib --features cc_brotli test::misc::test_memory_fill_overflow_native_trap
